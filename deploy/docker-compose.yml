# 企业知识库 RAG 全栈本地部署。
# 模型全部使用宿主机已备好的本地权重：不联网下载、不需要 ollama pull。
#   Ollama 模型仓库：<工作区>/models   —— 内含 registry.ollama.ai/library/qwen3/{8b,latest} 与 blobs
#   bge-m3 权重：    <工作区>/bge-m3   —— sentence-transformers 目录（1024 维）
# 两个路径默认按「本文件所在目录」上溯两级解析（deploy → RAG-project → 工作区根目录）；
# 目录结构不同时用环境变量覆盖（建议写绝对路径）：
#   OLLAMA_MODELS_HOST_PATH / EMBEDDING_MODEL_HOST_PATH
# 首次构建 + 启动：
#   docker compose -f deploy/docker-compose.yml up -d --build
# 已有分开的 Milvus/MinerU compose 时，先停止它们，避免端口冲突。

services:
  mysql:
    image: rag-mysql:rag-8.0
    pull_policy: never
    container_name: rag-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DB:-rag_knowledge}
      # 容器默认 UTC。created_at 由 MySQL 侧的 DEFAULT CURRENT_TIMESTAMP 生成
      # （default-time-zone=SYSTEM，跟随容器时区），而 updated_at / next_run_at 是
      # backend 用 datetime.now() 写的本地时间——两处必须同一时区，否则同表内差 8 小时。
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 12

  etcd:
    image: rag-etcd:rag-v3.5.14
    pull_policy: never
    container_name: rag-milvus-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
      ETCD_SNAPSHOT_COUNT: 50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: rag-minio:rag-RELEASE.2023-03-20T20-16-18Z
    pull_policy: never
    container_name: rag-milvus-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12

  milvus:
    image: rag-milvus:rag-v2.4.13
    pull_policy: never
    container_name: rag-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "127.0.0.1:${MILVUS_HOST_PORT:-19530}:19530"
      - "127.0.0.1:${MILVUS_HEALTH_HOST_PORT:-9091}:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

  ollama:
    image: rag-ollama:rag-latest
    pull_policy: never
    container_name: rag-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11434}:11434"
    environment:
      # 模型仓库即下面挂进来的宿主目录，容器内无需再 ollama pull
      OLLAMA_MODELS: /root/.ollama/models
      # 模型常驻内存/显存时长：qwen3:8b 有 5.2GB，间隔短时避免每次问答重新加载
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    volumes:
      # 命名卷只放密钥/历史等可写状态；模型目录单独挂宿主本地仓库（qwen3:8b 已在其中）
      - ollama_data:/root/.ollama
      - ${OLLAMA_MODELS_HOST_PATH:-../../models}:/root/.ollama/models
    healthcheck:
      # 模型能真的列出来才算健康——顺带验证宿主模型目录挂载正确
      test: ["CMD-SHELL", "ollama show ${LLM_MODEL:-qwen3:8b} >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  mineru:
    image: rag-mineru:rag-4
    pull_policy: never
    container_name: rag-mineru
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MINERU_HOST_PORT:-8001}:8000"
    environment:
      MINERU_MODEL_SOURCE: local
    entrypoint: ["mineru-kit"]
    command: ["api-server", "--host", "0.0.0.0", "--port", "8000", "--tier", "standard"]
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  backend:
    image: rag-backend:rag-0.1.0
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: rag-backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-RAG Knowledge Base Service}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DEBUG: ${DEBUG:-false}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DB: ${MYSQL_DB:-rag_knowledge}
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      # 容器内固定路径，由下面的宿主目录挂载提供（离线加载，不联网下载）
      EMBEDDING_MODEL: /models/bge-m3
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cuda}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen3:8b}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OLLAMA_BASE_URL: http://ollama:11434/v1
      PDF_PARSER: ${PDF_PARSER:-mineru}
      MINERU_API_URL: http://mineru:8000
      # advanced：VLM 能解析脑图/流程图等图形化内容（与官方 API 一致）；standard 更快但图形化排版会整页判成图片
      MINERU_TIER: ${MINERU_TIER:-advanced}
      DOCUMENT_WORKER_ENABLED: ${DOCUMENT_WORKER_ENABLED:-true}
      # 日志的 %(asctime)s 与业务写入的 updated_at / next_run_at 都取进程本地时间
      # （logging 用 time.localtime、代码用 datetime.now()），容器默认 UTC 会整体慢 8 小时；
      # 需与 mysql 服务同一个值，保证 DB 内时间基准一致。
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ../uploads:/app/uploads
      - ../logs:/app/logs
      # bge-m3 权重来自宿主本地目录（默认工作区根下 bge-m3），只读挂载
      - ${EMBEDDING_MODEL_HOST_PATH:-../../bge-m3}:/models/bge-m3:ro
    # Embedding 走 GPU：镜像内 torch 是 cu130 构建（实测支持 RTX 5080 / sm_120），
    # 不预留设备时 torch.cuda.is_available() 为 False，会在 CPU 上跑（慢 10 倍以上）。
    # 显存紧张时把 deploy/.env 里 EMBEDDING_DEVICE 设为 cpu 即可退回 CPU。
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    depends_on:
      mysql:
        condition: service_healthy
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_healthy
      mineru:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  etcd_data:
  minio_data:
  milvus_data:
  ollama_data:
