# 企业知识库 RAG 全栈本地部署。
# 首次使用前：准备 ./models/bge-m3，并执行
#   docker compose -f deploy/docker-compose.yml exec ollama ollama pull qwen3:8b
# 已有分开的 Milvus/MinerU compose 时，先停止它们，避免端口冲突。

services:
  mysql:
    image: mysql:8.0
    container_name: rag-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DB:-rag_knowledge}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 12

  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: rag-milvus-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
      ETCD_SNAPSHOT_COUNT: 50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: rag-milvus-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12

  milvus:
    image: milvusdb/milvus:v2.4.13
    container_name: rag-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "127.0.0.1:${MILVUS_HOST_PORT:-19530}:19530"
      - "127.0.0.1:${MILVUS_HEALTH_HOST_PORT:-9091}:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama

  mineru:
    image: mineru:4
    container_name: rag-mineru
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MINERU_HOST_PORT:-8001}:8000"
    environment:
      MINERU_MODEL_SOURCE: local
    entrypoint: ["mineru-kit"]
    command: ["api-server", "--host", "0.0.0.0", "--port", "8000", "--tier", "standard"]
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: rag-backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-RAG Knowledge Base Service}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DEBUG: ${DEBUG:-false}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DB: ${MYSQL_DB:-rag_knowledge}
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      EMBEDDING_MODEL: /models/bge-m3
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen3:8b}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OLLAMA_BASE_URL: http://ollama:11434/v1
      PDF_PARSER: ${PDF_PARSER:-mineru}
      MINERU_API_URL: http://mineru:8000
      DOCUMENT_WORKER_ENABLED: ${DOCUMENT_WORKER_ENABLED:-true}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ../uploads:/app/uploads
      - ../logs:/app/logs
      - ${EMBEDDING_MODEL_HOST_PATH:-../models/bge-m3}:/models/bge-m3:ro
    depends_on:
      mysql:
        condition: service_healthy
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_started
      mineru:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  etcd_data:
  minio_data:
  milvus_data:
  ollama_data:
