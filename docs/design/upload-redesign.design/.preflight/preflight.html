    <style id="theme-vars">
:root {
  /* Brand prefix: rag */
  --rag-background: #f8fafc;
  --rag-foreground: #0f172a;
  --rag-card: #ffffff;
  --rag-card-foreground: #0f172a;
  --rag-popover: #ffffff;
  --rag-popover-foreground: #0f172a;
  --rag-primary: #6366f1;
  --rag-primary-foreground: #ffffff;
  --rag-secondary: #f1f5f9;
  --rag-secondary-foreground: #334155;
  --rag-muted: #f1f5f9;
  --rag-muted-foreground: #64748b;
  --rag-accent: #eef2ff;
  --rag-accent-foreground: #4338ca;
  --rag-destructive: #ef4444;
  --rag-destructive-foreground: #ffffff;
  --rag-border: #e2e8f0;
  --rag-input: #e2e8f0;
  --rag-ring: #6366f1;

  /* State colors */
  --rag-success: #10b981;
  --rag-success-foreground: #ffffff;
  --rag-warning: #f59e0b;
  --rag-warning-foreground: #ffffff;
  --rag-info: #3b82f6;
  --rag-info-foreground: #ffffff;

  /* Radius scale */
  --rag-radius-sm: 6px;
  --rag-radius-md: 10px;
  --rag-radius-lg: 14px;
  --rag-radius-xl: 20px;

  /* Typography */
  --rag-font-sans: 'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
}

html {
  font-family: var(--rag-font-sans);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  background-color: var(--rag-background);
  color: var(--rag-foreground);
}

    </style>

    --radius-md: var(--rag-radius-md);
    --radius-lg: var(--rag-radius-lg);
    --radius-xl: var(--rag-radius-xl);

  @layer base {

    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
